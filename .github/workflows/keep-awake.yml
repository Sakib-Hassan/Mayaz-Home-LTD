# Keeps the Supabase project awake, and takes a weekly backup.
#
# Free Supabase projects sleep after 7 days with no activity, and residents
# only use the app at the start and end of the month. This pings daily so
# that never happens, and on Mondays exports the data to CSV in this repo.
#
# Put this file at:  .github/workflows/keep-awake.yml
#
# Needs, under Settings -> Secrets and variables -> Actions:
#
#   Variables tab:
#     SUPABASE_URL       https://abcdefgh.supabase.co   (no trailing slash)
#
#   Secrets tab:
#     SUPABASE_KEY       the publishable / anon key
#     BACKUP_EMAIL       a committee account's email
#     BACKUP_PASSWORD    that account's password
#
# The backup signs in as a normal committee account rather than using the
# service_role key. That key bypasses every security rule in the database,
# and storing it here would mean a compromised repository hands over the
# whole project. A committee login can read what the committee can read,
# which is all a backup needs.

name: Keep Supabase awake

on:
  schedule:
    # 03:17 UTC daily (09:17 Dhaka). Deliberately not on the hour — those
    # slots are the most contended and the most often dropped.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check the configuration
        id: cfg
        env:
          RAW_URL: ${{ vars.SUPABASE_URL }}
          RAW_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Strip whitespace, including a trailing newline copied with the
          # value — invisible in logs, and it broke this job once already.
          URL=$(printf '%s' "$RAW_URL" | tr -d '[:space:]')
          KEY=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')
          echo "raw URL length: ${#RAW_URL}, cleaned: ${#URL}"
          echo "raw KEY length: ${#RAW_KEY}, cleaned: ${#KEY}"

          fail=0
          if [ -z "$URL" ]; then
            echo "::error::SUPABASE_URL is empty. Add it on the Variables tab."
            fail=1
          else
            case "$URL" in https://*) ;; *) echo "::error::SUPABASE_URL must start with https://"; fail=1 ;; esac
            URL="${URL%/}"
            echo "using URL: $URL"
          fi
          [ -z "$KEY" ] && { echo "::error::SUPABASE_KEY is empty."; fail=1; }

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          exit $fail

      # THE PING. If this passes the project stays awake, whatever happens
      # in the steps below.
      - name: Query the database
        env:
          URL: ${{ steps.cfg.outputs.url }}
          KEY: ${{ steps.cfg.outputs.key }}
        run: |
          ok=0
          for attempt in 1 2 3; do
            code=$(curl -s -m 30 -o /tmp/out.txt -w "%{http_code}" \
              "$URL/rest/v1/flats?select=id&limit=1" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            cx=$?
            echo "attempt $attempt -> HTTP $code (curl exit $cx)"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 10
          done
          cat /tmp/out.txt || true
          if [ "$ok" = "1" ]; then
            echo "Database answered. Inactivity timer reset."
          else
            echo "::error::Supabase never answered with 200. Check the key, or whether the project is paused."
            exit 1
          fi

      # ---------------- weekly backup ----------------
      # Mondays only. Everything below is best-effort: a failed backup must
      # not make the job red and hide a failing ping.
      - uses: actions/checkout@v4
        continue-on-error: true

      - name: Export the data to CSV
        id: backup
        continue-on-error: true
        env:
          URL: ${{ steps.cfg.outputs.url }}
          KEY: ${{ steps.cfg.outputs.key }}
          EMAIL: ${{ secrets.BACKUP_EMAIL }}
          PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          if [ "$(date -u +%u)" != "1" ]; then
            echo "Not Monday — skipping the backup."
            echo "did=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$EMAIL" ] || [ -z "$PASSWORD" ]; then
            echo "::warning::BACKUP_EMAIL / BACKUP_PASSWORD are not set, so no backup was taken."
            echo "did=no" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # sign in as the committee account and use its token, so row level
          # security still applies and no privileged key is involved
          TOKEN=$(curl -s -m 30 -X POST "$URL/auth/v1/token?grant_type=password" \
            -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")

          if [ -z "$TOKEN" ]; then
            echo "::warning::Could not sign in as the backup account. No backup taken."
            echo "did=no" >> "$GITHUB_OUTPUT"; exit 0
          fi

          mkdir -p backups
          rc=0
          for t in flats bills service_charges contacts profiles change_requests notices; do
            code=$(curl -s -m 60 -o "backups/$t.csv" -w "%{http_code}" \
              "$URL/rest/v1/$t?select=*" \
              -H "apikey: $KEY" -H "Authorization: Bearer $TOKEN" \
              -H "Accept: text/csv")
            lines=$(wc -l < "backups/$t.csv" 2>/dev/null || echo 0)
            echo "$t -> HTTP $code, $lines lines"
            [ "$code" = "200" ] || rc=1
          done

          date -u +"Backed up %Y-%m-%d %H:%M UTC" > backups/README.txt
          echo "did=yes" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Commit the backup
        continue-on-error: true
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-ping
          git config user.name  "keep-awake"
          git config user.email "actions@github.com"
          git add .last-ping backups 2>/dev/null || git add .last-ping
          git diff --staged --quiet || git commit -m "keep-awake: ping$(
            [ "${{ steps.backup.outputs.did }}" = "yes" ] && echo ' + weekly backup')"
          git push
